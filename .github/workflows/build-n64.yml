
name: Build GA36 N64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-preflight:
    uses: ./.github/workflows/n64-source-preflight.yml

  build-n64:
    needs: source-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare download cache directory
        run: mkdir -p rootfs/dl

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: rootfs/dl
          key: ga36-br-dl-v1-${{ hashFiles('rootfs/Dockerfile', 'rootfs/configs/goodluck_defconfig') }}
          restore-keys: |
            ga36-br-dl-v1-

      - name: Build N64 core
        working-directory: rootfs
        run: |
          docker compose run --build --rm goodluck-builder bash -lc '
            set -e
            /src/scripts/configure.sh
            /src/scripts/build.sh parallel-n64-ga36
          '

      - name: Check generated core
        run: |
          set -e
          CORE="rootfs/out/target/usr/lib/libretro/parallel_n64_goodluck_libretro.so"
          test -s "$CORE"
          file "$CORE"
          readelf -h "$CORE"
          mkdir -p n64-output
          cp "$CORE" n64-output/

      - name: Upload N64 core
        uses: actions/upload-artifact@v4
        with:
          name: GA36-N64-Experimental
          path: n64-output/*.so
          if-no-files-found: error
